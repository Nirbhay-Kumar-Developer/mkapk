---
name: "CodeQL Advanced & Linting Pipeline"

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '18 21 * * 2'

jobs:
  # --- DEEP SEMANTIC CODE ANALYSIS (C++, Java) ---
  analyze:
    name: CodeQL Security Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: java-kotlin
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install C/C++ Build Dependencies
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libzip-dev \
            libssl-dev \
            libxxhash-dev \
            nlohmann-json3-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      # --- DYNAMIC BUILD FOR C/C++ ---
      - name: Build C/C++ Core & Modules
        if: matrix.language == 'c-cpp'
        shell: bash
        run: |
          set -euo pipefail
          echo ">> Building C++ codebase via Makefile for CodeQL..."
          LINK_FLAGS="-lcrypto -lssl -lzip -lpthread"
          if ! make -j"$(nproc)" BUILD_MODE=release LDFLAGS="$LINK_FLAGS"; then
            echo ">> Makefile failed. Falling back to dynamic discovery..."
            mkdir -p build/obj
            mapfile -t SRCS < <(find src -type f -name "*.cpp")
            g++ -std=c++20 -O2 -I./include -I./src -c "${SRCS[@]}"
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # --- AUTOMATED BUILD SCRIPT AND MAKEFILE LINTING ---
  lint:
    name: Lint Automation Scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # MegaLinter now triggers globally every execution path
      - name: Run MegaLinter
        uses: oxsecurity/megalinter@v7
        env:
          VALIDATE_ALL_CODEBASE: true
          MEGALINTER_FLAVOR: documentation
          ENABLE_LINTERS: BASH_SHELLCHECK,MAKEFILE_CHECKMAKE
          DISABLE_ERRORS: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SARIF_REPORTER: true

      - name: Upload MegaLinter Scan Results to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'megalinter-reports/megalinter-report.sarif'
          category: "megalinter"
