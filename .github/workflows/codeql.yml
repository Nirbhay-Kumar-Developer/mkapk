---
name: "CodeQL Advanced & Linting Pipeline"

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '18 21 * * 2'

jobs:
  # --- DEEP SEMANTIC CODE ANALYSIS (C++, Java) ---
  analyze:
    name: CodeQL Security Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: java-kotlin
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Integrated: Running advanced security and quality suites
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      # --- MANUAL BUILD FOR C/C++ ---
      - name: Build C/C++ Core & Modules
        if: matrix.language == 'c-cpp'
        shell: bash
        run: |
          sed -i 's/\r$//' compile.sh 2>/dev/null || true
          echo "Attempting build via repository scripts..."
          if [ -f ./compile.sh ] && bash compile.sh; then
            echo "Build via compile.sh succeeded."
          elif [ -f Makefile ] || [ -f makefile ] && make; then
            echo "Build via Makefile succeeded."
          else
            echo "Standard build scripts failed or mismatched environment."
            echo "Dropping to flat compiler fallback for CodeQL..."
            mkdir -p bin
            g++ -std=c++17 \
                -Iinclude \
                src/main.cpp \
                src/mkapk_compiler.cpp \
                src/mkapk_env.cpp \
                src/mkapk_helper.cpp \
                src/modules/build_pipeline.cpp \
                src/modules/change_checker.cpp \
                src/modules/daemon.cpp \
                src/modules/plugins/plugin_manager.cpp \
                src/modules/build_modules/dex.cpp \
                src/modules/build_modules/finish.cpp \
                src/modules/build_modules/java.cpp \
                src/modules/build_modules/kotlin.cpp \
                src/modules/build_modules/native.cpp \
                src/modules/build_modules/res.cpp \
                src/modules/dependency/extracter.cpp \
                src/modules/dependency/manifest_merger.cpp \
                src/modules/dependency/resolver.cpp \
                -o mkapk_bin || {
                  echo "Warning: Native header missing."
                  echo "Compiling interfaces for CodeQL extraction..."
                  g++ -std=c++17 -c -Iinclude \
                      src/*.cpp \
                      src/modules/*.cpp \
                      src/modules/build_modules/*.cpp \
                      src/modules/dependency/*.cpp \
                      src/modules/plugins/*.cpp || true
                }
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

  # --- AUTOMATED BUILD SCRIPT AND MAKEFILE LINTING ---
  lint:
    name: Lint Automation Scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # MegaLinter now triggers globally every execution path
      - name: Run MegaLinter
        uses: oxsecurity/megalinter@v7
        env:
          VALIDATE_ALL_CODEBASE: true
          MEGALINTER_FLAVOR: documentation
          ENABLE_LINTERS: BASH_SHELLCHECK,MAKEFILE_CHECKMAKE
          DISABLE_ERRORS: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SARIF_REPORTER: true

      - name: Upload MegaLinter Scan Results to GitHub Security Tab
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'megalinter-reports/megalinter-report.sarif'
          